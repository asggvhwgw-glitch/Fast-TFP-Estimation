[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasttfp"
version = "0.4.0"
description = "Theory-first high-performance OP LP ACF GNR production function estimators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "joblib>=1.3"]

[project.optional-dependencies]
gpu = ["cupy"]
dev = ["pytest"]
